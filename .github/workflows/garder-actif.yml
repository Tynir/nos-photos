# Optionnel : interroge les bases tous les 3 jours pour que les projets
# Supabase gratuits ne se mettent pas en pause (pause après 7 jours sans activité).
# Secrets à créer dans le dépôt GitHub : SUPABASE_URL et SUPABASE_ANON_KEY,
# et, si tu as un 2e projet de stockage, SUPABASE2_URL et SUPABASE2_ANON_KEY.
name: Garder Supabase actif
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Projet principal
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/albums?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
      - name: 2e projet de stockage
        env:
          URL2: ${{ secrets.SUPABASE2_URL }}
          KEY2: ${{ secrets.SUPABASE2_ANON_KEY }}
        run: |
          if [ -n "$URL2" ]; then
            curl -fsS "$URL2/rest/v1/members?select=user_id&limit=1" -H "apikey: $KEY2"
          else
            echo "Pas de 2e projet configuré"
          fi
